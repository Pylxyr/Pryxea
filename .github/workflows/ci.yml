name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libopus is built from the bundled source with cmake (preinstalled on GitHub's runners).
      - name: Test
        run: cargo test --locked
      - name: Release build and size
        shell: bash
        run: |
          cargo build --release --locked
          ls -l target/release/pryxea* | grep -v '\.d$' || true

  minimum-rust-version:
    name: Builds on the oldest supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets
